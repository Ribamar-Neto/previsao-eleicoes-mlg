[project]
name = "previsao-eleicoes"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "esda>=2.10.0",
    "geobr>=2.1.1",
    "geopandas>=1.2.0",
    "jupyter>=1.1.1",
    "kaleido>=1.5.2",
    "libpysal>=4.15.1",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks"]

[tool.mypy]
# Os notebooks importam os módulos de src/ pelos dois caminhos (src.x e x); a base explícita evita o nome duplicado.
explicit_package_bases = true
ignore_missing_imports = true
